<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d" xml:lang="tr">
  <title id="t">Aynen — Türkçe Metin Doğallaştırıcı</title>
  <desc id="d">İnsan gibi yazar, söylediğini aynen korur. Sağda bir cümle: "Günümüzde, bu bağlamda" üstü çizilmiş; "ilişkili olabilir" altı çizili olarak korunmuş.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ad { font-size: 136px; font-weight: 700; letter-spacing: -4px; fill: #EEEBE4; }
    .alt { font-size: 34px; font-weight: 500; fill: #A9ADB4; }
    .slogan { font-size: 30px; font-weight: 400; fill: #EEEBE4; }
    .vurgu { font-weight: 600; fill: #5BC8A8; }
    .satir { font-size: 30px; fill: #EEEBE4; }
    .silik { fill: #6F747D; }
    .kalan { font-weight: 600; }
    .cizik { stroke: #8A8F98; stroke-width: 2.5; stroke-linecap: round; }
    .cizgi { stroke: #262A31; stroke-width: 1; }
  </style>
  <rect width="1280" height="360" rx="16" fill="#13161B"/>

  <text class="ad" x="76" y="158">Aynen</text>
  <text class="alt" x="80" y="234">Türkçe Metin Doğallaştırıcı</text>
  <text class="slogan" x="80" y="296">İnsan gibi yazar, söylediğini <tspan class="vurgu">aynen</tspan> korur.</text>

  <g>
    <line class="cizgi" x1="800" y1="188" x2="1200" y2="188"/>
    <line class="cizgi" x1="800" y1="250" x2="1200" y2="250"/>
    <line class="cizgi" x1="800" y1="312" x2="1200" y2="312"/>

    <text class="satir silik" x="800" y="172" textLength="172">Günümüzde,</text>
    <line class="cizik" x1="797" y1="162" x2="975" y2="162"/>
    <text class="satir silik" x="986" y="172" textLength="182">bu bağlamda,</text>
    <line class="cizik" x1="983" y1="162" x2="1171" y2="162"/>

    <text class="satir" x="800" y="234">gece çalışması bel ağrısıyla</text>

    <text class="satir kalan" x="800" y="296" textLength="182">ilişkili olabilir</text>
    <text class="satir" x="983" y="296">.</text>
    <rect x="800" y="304" width="182" height="3.5" rx="1.75" fill="#5BC8A8"/>
  </g>
</svg>
