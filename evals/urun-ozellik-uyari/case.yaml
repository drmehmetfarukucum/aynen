schema_version: "1.1"
name: urun-ozellik-uyari
expected_outcome: |
  Tanıtım registerı ve satış dili korunur. 12 saat sıcak, 24 saat soğuk ('kadar' ile), ölçüm koşulları, 18/8, BPA içermeyen, 500 ml ve 310 gram aynen kalır. 'Şık, dayanıklı ve hafif' üç nitelik olarak kalır. Elde yıkama öneri olarak kalır; gövde bulaşık makinesinde yıkanabilir, kapak kesinlikle konmamalıdır. Gazlı içecek uyarısı ve sızdırmazlık garantisinin koşulu kalır. 'Günümüzün yoğun temposunda', 'İşte tam da bu noktada ... devreye giriyor' ve 'olup' kalkar.
